name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Arch Linux, like Omarchy: the same current Qt 6 users run.
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git jq python qt6-declarative

      - uses: actions/checkout@v5

      - name: Pre-release checks
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/check.sh
