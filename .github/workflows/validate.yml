name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt 6 tools (qmllint)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qt6-declarative-dev-tools

      - name: Pre-release checks
        run: scripts/check.sh
